title: "Soufiane Bouarfa"
description: "Enterprise architect. Research background in complex sociotechnical systems. Founder of Novel Insights."
url: "https://www.soufianebouarfa.com"
timezone: "Europe/Amsterdam"

markdown: kramdown

include:
  - ".well-known"

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-redirect-from
